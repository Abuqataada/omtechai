<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | OmTechAI Limited</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo-link">
                <img src="{{ url_for('static', filename='images/omtechai_logo.png') }}" alt="OmTechAI Logo" class="logo">
            </a>
            
            <nav class="desktop-nav">
                <a href="/">Home</a>
                <a href="/services">Services</a>
                <a href="/tools">Tools</a>
                <a href="/projects">Projects</a>
                <a href="/contact">Contact</a>
            </nav>
            
            <button class="mobile-menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
        
        <nav class="mobile-nav">
            <a href="/">Home</a>
            <a href="/services">Services</a>
            <a href="/tools">Tools</a>
            <a href="/contact">Contact</a>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>OmTechAI Limited</h3>
                <p>Innovating the Future with Smart Software & AI Solutions.</p>
            </div>
            <div class="footer-section">
                <h4>Quick Links</h4>
                <a href="/services">Services</a>
                <a href="/tools">Tools</a>
                <a href="/contact">Contact</a>
            </div>
            <div class="footer-section">
                <h4>Connect With Us</h4>
                <div class="social-links">
                    <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                    <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 OmTechAI Limited — Technology for the Future</p>
        </div>
    </footer>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
